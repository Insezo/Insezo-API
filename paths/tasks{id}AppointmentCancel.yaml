post:
  summary: Cancels an appointment for visit
  description: ""
  tags:
    - Tasks
  parameters:
    - name: id
      required: true
      in: path
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            communication:
              type: boolean
              description: Mail the customer that the appointment was cancelled 
        example:
          { "communication": true }
  responses:
    '200':
      description: Ok
      content:
        application/json:
          example:
            result:
              {
                "success": true
              }
    '400':
      description: Bad Request
    '401':
      description: Unauthorized
    '403':
      description: The company may not view this task
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: FORBIDDEN
              message: No access to this task
    '404':
      description: Task not found
      content:        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: UNKNOWN_RESOURCE
              message: Task number 'abcd01012026-000000' does not exist
    '422':
      description: >
        `INVALID_ACTION` when the task is finished or has no planned visit.
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: INVALID_ACTION
              message: Task has no planned visit
    '500':
      description: The task could not be updated
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: RESOURCE_NOT_UPDATED
              message: Appointment could not be cancelled
