post:
  summary: Unassign a technician from task
  description: ""
  tags:
    - Tasks
  parameters:
    - name: id
      required: true
      in: path
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            identifier:
              type: string
              description: ID of technician
            communication:
              type: boolean
              description: Send communication to technician
            keepAppointment:
              type: boolean
              description: If a appointment already has been made keep the data
          required:
            - identifier
        example:
          { "identifier": "0123456789","communication": true,"keepAppointment": false }
  responses:
    '200':
      description: Ok
    '400':
      description: Bad Request
    '422':
      description: Unprocessable Entity