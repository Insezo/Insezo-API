post:
  summary: Unassign a technician from task
  description: ""
  tags:
    - Tasks
  parameters:
    - name: id
      required: true
      in: path
      schema:
        type: string
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            identifier:
              type: string
              description: ID of the technician assigned to the task
            communication:
              type: boolean
              description: Mail the technician that the task was taken away 
            keepAppointment:
              type: boolean
              description: If a appointment already has been made keep the data
          required:
            - identifier
        example:
          { "identifier": "a1b2c3","communication": true,"keepAppointment": false }
  responses:
    '200':
      description: Ok
      content:
        application/json:
          example:
            result:
              {
                "success": true
              }
    '401':
      description: Unauthorized
    '403':
      description: The company may not view this task
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: FORBIDDEN
              message: No access to this task
    '404':
      description: Task not found
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: UNKNOWN_RESOURCE
              message: Task number 'abcd01012026-000000' does not exist
    '422':
      description: >
        `INVALID_ACTION` when the task is finished or has no technician,
        `INSUFFICIENT_PERMISSIONS` when the caller is neither the contractor nor the technician company,
        `INVALID_PARAMETER_TYPE` when `identifier` is not the assigned technician,
        `MISSING_JSON_FIELD` when required fields (such as `identifier`) is missing.
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: INVALID_PARAMETER_TYPE
              message: identifier 'x9y8z7' is not the technician assigned to this task
    '500':
      description: The task could not be updated
      content:
        application/json:
          schema:
            $ref: ../schemas/error-response.yaml
          example:
            error:
              error_code: RESOURCE_NOT_UPDATED
              message: Technician could not be unassigned
